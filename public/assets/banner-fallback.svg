<text x="600" y="438" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="900" letter-spacing="8">NOXVELLOX</text>
<text x="600" y="480" text-anchor="middle" fill="#ffbdca" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="5">CURATED COLLECTION</text>
</svg>