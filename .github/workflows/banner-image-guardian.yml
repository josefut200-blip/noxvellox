name: Banner image guardian

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/_worker.js'
      - 'public/assets/site.v028.js'
      - 'public/assets/banner-fallback.svg'
      - 'scripts/check-banner-images.mjs'
      - '.github/workflows/banner-image-guardian.yml'

permissions:
  contents: read

concurrency:
  group: banner-image-guardian
  cancel-in-progress: false

jobs:
  check-banner-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check banner images and fallback
        run: node scripts/check-banner-images.mjs
