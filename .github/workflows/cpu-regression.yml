name: CPU regression guard

on:
  push:
    branches:
      - fix-cpu-1102
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  worker-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
