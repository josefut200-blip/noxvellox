name: Audit official video embeds

on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-official-embeds
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check official embed availability
        run: node scripts/audit-official-embeds.mjs

      - name: Commit confirmed unavailable embeds
        run: |
          if git diff --quiet -- public/data/partner-videos.json; then
            echo "No confirmed blocked or unavailable embeds."
            exit 0
          fi

          git config user.name "noxvellox-embed-audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/partner-videos.json
          git commit -m "chore: remove unavailable official embeds"
          git push
