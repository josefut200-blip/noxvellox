name: Generate and publish English SEO video batch

on:
  push:
    paths:
      - 'data/video-batch-request.txt'
  workflow_dispatch:
    inputs:
      items:
        description: "Enter AUTO_FILL:100 to import from Pornhub’s official embeddable-video export, or 5–10 video links/iframes."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-seo-video-batch
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate videos and publish feed entries
        run: node scripts/generate-seo-video-batch.mjs
        env:
          VIDEO_BATCH_INPUT: ${{ inputs.items }}

      - name: Commit new official embeds
        run: |
          if git diff --quiet -- public/data/manual-official-videos.json; then
            echo "No new video entries to publish."
          else
            git config user.name "noxvellox-feed-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/manual-official-videos.json
            git commit -m "chore: publish approved official video batch"
            git push
          fi

      - name: Upload formatted batch
        uses: actions/upload-artifact@v4
        with:
          name: english-seo-video-batch
          path: artifacts/seo-video-batch.json
          if-no-files-found: error
          retention-days: 7
